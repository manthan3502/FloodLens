name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: floodlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: floodlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U floodlens"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://floodlens:ci-only-password@localhost:5432/floodlens
      PYTHONPATH: backend:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-lock.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: python -m data_pipeline.seed
      - run: python -m data_pipeline.score
      - run: pytest backend/tests data_pipeline/tests -q
      - run: ruff check backend data_pipeline scripts
      - run: black --check backend data_pipeline scripts
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
